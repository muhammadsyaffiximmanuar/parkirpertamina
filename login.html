<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('button[type="submit"]');

            const errorBox = document.createElement('div');
            errorBox.className = 'hidden text-error text-body-md bg-error-container/40 border border-error/20 rounded-lg px-md py-sm';
            submitBtn.insertAdjacentElement('beforebegin', errorBox);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btnText = submitBtn.querySelector('span');
                const originalText = btnText.innerText;

                errorBox.classList.add('hidden');
                btnText.innerText = 'Memproses...';
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

                try {
                    const formData = new FormData(form);
                    const response = await fetch('login.php', {
                        method: 'POST',
                        body: formData,
                    });
                    const result = await response.json();

                    if (result.success) {
                        btnText.innerText = 'Berhasil, mengalihkan...';
                        window.location.href = result.redirect || 'aktivitas.php';
                    } else {
                        errorBox.textContent = result.message || 'Login gagal. Periksa kembali data Anda.';
                        errorBox.classList.remove('hidden');
                        btnText.innerText = originalText;
                        submitBtn.disabled = false;
                        submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    }
                } catch (err) {
                    errorBox.textContent = 'Tidak dapat terhubung ke server. Coba lagi.';
                    errorBox.classList.remove('hidden');
                    btnText.innerText = originalText;
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                }
            });

            // Password visibility toggle
            const togglePass = document.querySelector('button[type="button"]');
            const passInput = document.getElementById('password');
            togglePass.addEventListener('click', () => {
                const type = passInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passInput.setAttribute('type', type);
                togglePass.querySelector('span').innerText = type === 'password' ? 'visibility' : 'visibility_off';
            });
        });
    </script>
